[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  TZ = "Europe/Warsaw"

# Redirect the legacy route to its canonical public URL.
[[redirects]]
  from = "/classes"
  to = "/directions"
  status = 301
  force = true

# SPA fallback: all application routes are served by index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  directory = "netlify/functions"

# Generated image URLs contain a content hash and change with the source.
[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
